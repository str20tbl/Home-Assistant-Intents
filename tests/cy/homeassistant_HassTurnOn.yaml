language: cy
tests:
  # troi dyfais ymlaen wrth enw / turn on a device by name
  - sentences:
      - "troi ffan nenfwd ymlaen"
      - "troi y ffan nenfwd ymlaen"
      - "cynnau ffan nenfwd"
    intent:
      name: HassTurnOn
      slots:
        name: Ffan Nenfwd
    response: "Wedi troi y ffan ymlaen"
  - sentences:
      - "troi switsh cegin ymlaen"
      - "rhoi switsh cegin ymlaen"
    intent:
      name: HassTurnOn
      slots:
        name: Switsh Cegin
    response: "Wedi troi y switsh ymlaen"
