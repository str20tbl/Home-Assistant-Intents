language: cy
tests:
  # actifadu golygfa wrth enw / activate a scene by name
  - sentences:
      - "actifadu modd parti"
      - "actifadu golygfa modd parti"
      - "modd parti ymlaen"
      - "newid i olygfa modd parti"
    intent:
      name: HassTurnOn
      slots:
        domain: scene
        name: Modd Parti
    response: "Wedi'i actifadu"
  # actifadu golygfa gydag ardal / activate a scene with an area
  - sentences:
      - "actifadu modd parti cegin"
      - "modd parti cegin"
    intent:
      name: HassTurnOn
      slots:
        area: Cegin
        domain: scene
        name: Modd Parti
    response: "Wedi'i actifadu"
  - sentences:
      - "actifadu modd parti yn y gegin"
    intent:
      name: HassTurnOn
      slots:
        area: Gegin
        domain: scene
        name: Modd Parti
    response: "Wedi'i actifadu"
