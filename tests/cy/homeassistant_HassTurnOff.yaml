language: cy
tests:
  # diffodd dyfais wrth enw / turn off a device by name
  - sentences:
      - "troi ffan nenfwd i ffwrdd"
      - "diffodd ffan nenfwd"
    intent:
      name: HassTurnOff
      slots:
        name: Ffan Nenfwd
    response: "Wedi diffodd y ffan"
  - sentences:
      - "troi switsh cegin i ffwrdd"
      - "diffodd switsh cegin"
    intent:
      name: HassTurnOff
      slots:
        name: Switsh Cegin
    response: "Wedi diffodd y switsh"
