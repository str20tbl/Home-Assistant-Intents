---
language: "cy"
intents:
  HassTurnOff:
    data:
      # datgloi wrth enw / unlock by name
      - sentences:
          - "<datgloi>[ <y>|<y>| <fy>| <ein>] {name} [<yn_area_floor>]"
        requires_context:
          domain: lock
        response: lock
      # datgloi cloeon mewn ardal / unlock locks in an area
      - sentences:
          - "<datgloi>[ <y>|<y>] [<pob> [o|o'r]] <lockable> [<yn_area_floor>]"
          - "<datgloi>[ <y>|<y>] [<pob> [o|o'r]] [<lockable>][ <y>|<y>] <area>"
        slots:
          domain: "lock"
          name: "all"
        response: lock
