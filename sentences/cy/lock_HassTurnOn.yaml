---
language: "cy"
intents:
  HassTurnOn:
    data:
      # cloi wrth enw / lock by name
      - sentences:
          - "<cloi>[ <y>|<y>| <fy>| <ein>] {name} [<yn_area_floor>]"
        requires_context:
          domain: lock
        response: lock
      # cloi cloeon mewn ardal / lock locks in an area
      - sentences:
          - "<cloi>[ <y>|<y>] [<pob> [o|o'r]] <lockable> [<yn_area_floor>]"
          - "<cloi>[ <y>|<y>] [<pob> [o|o'r]] <area> [<lockable>]"
        slots:
          domain: "lock"
        response: lock
