---
language: "cy"
intents:
  HassTurnOn:
    data:
      # actifadu golygfa wrth enw / activate a scene by name
      - sentences:
          - "[<actifadu>] [golygfa][ <y>|<y>| <fy>| <ein>] {name}"
          - "[<y>|<fy>|<ein>] {name} (ymlaen|arno)"
          - "<newid_i> [golygfa] {name}"
        requires_context:
          domain: scene
        slots:
          domain: scene
        response: scene
      # actifadu golygfa gydag ardal / activate a scene with an area
      - sentences:
          - "[<actifadu>][ <y>|<y>| <fy>| <ein>] [golygfa] <area> {name}"
          - "[<actifadu>][ <y>|<y>| <fy>| <ein>] [golygfa] {name} <yn> <area>"
        requires_context:
          domain: scene
        slots:
          domain: scene
        response: scene
