---
language: "cy"
intents:
  HassTurnOff:
    data:
      # cau gorchudd wrth enw / close a cover by name
      - sentences:
          - "<cau>[ <y>|<y>| <fy>| <ein>] {name} [<yn_area_floor>]"
        requires_context:
          domain: cover
        response: cover
      # cau yn ôl dosbarth dyfais (ac ardal) / close by device_class (optionally in an area)
      - sentences:
          - "<cau>[ <y>|<y>| <fy>| <ein>] {cover_classes:device_class} [<yn_area_floor>]"
          - "<cau>[ <y>|<y>| <fy>| <ein>] <area> {cover_classes:device_class}"
        slots:
          domain: cover
        response: cover_device_class
      # cau yn ôl dosbarth dyfais yn yr un ardal â lloeren / device_class here
      - sentences:
          - "<cau>[ <y>|<y>| <fy>| <ein>] {cover_classes:device_class} [<yma>]"
        slots:
          domain: cover
        response: cover_device_class
        requires_context:
          area:
            slot: true
